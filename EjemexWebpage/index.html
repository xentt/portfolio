<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuerpo de Fuerzas Especiales - Ejercito Mexicano</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;700&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#0a0c0a;font-family:'Oswald',sans-serif;width:100vw;height:100vh;user-select:none}
.scene{position:relative;width:100vw;height:100vh;overflow:hidden}
.layer{position:absolute;top:0;left:0;width:100%;height:100%;will-change:transform}
.layer svg{width:100%;height:100%;display:block}

/* CROSSHAIR */
.crosshair{position:fixed;z-index:9999;pointer-events:none;mix-blend-mode:difference}
.ch-ring{width:32px;height:32px;border:1.5px solid rgba(200,170,90,.6);border-radius:50%;position:absolute;top:-16px;left:-16px;transition:transform .15s,border-color .15s}
.ch-dot{width:4px;height:4px;background:#c8aa5a;border-radius:50%;position:absolute;top:-2px;left:-2px}
.ch-line{position:absolute;background:rgba(200,170,90,.4)}
.ch-top{width:1.5px;height:8px;top:-24px;left:-.75px}
.ch-bot{width:1.5px;height:8px;top:16px;left:-.75px}
.ch-left{width:8px;height:1.5px;top:-.75px;left:-24px}
.ch-right{width:8px;height:1.5px;top:-.75px;left:16px}
.crosshair.active .ch-ring{transform:scale(1.5);border-color:rgba(200,170,90,1)}

/* TITLE */
.title-block{position:absolute;bottom:6vh;left:5vw;z-index:50;pointer-events:none}
.t-label{font-family:'Share Tech Mono',monospace;font-size:.6rem;letter-spacing:.4em;color:rgba(200,170,90,.5);text-transform:uppercase;margin-bottom:.4rem;opacity:0;animation:fadeR .8s ease .3s forwards}
.title-block h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.2rem,6.5vw,5.5rem);letter-spacing:.1em;color:rgba(232,224,208,.92);line-height:.88;text-shadow:0 0 40px rgba(0,0,0,.9),0 2px 12px rgba(0,0,0,.7);opacity:0;animation:fadeR 1s ease .6s forwards}
.title-block h1 span{display:block;font-size:.38em;letter-spacing:.4em;color:rgba(200,170,90,.6);margin-top:.3em}
.t-line{width:60px;height:1.5px;background:linear-gradient(90deg,#c8aa5a,transparent);margin:.8rem 0;opacity:0;animation:fadeR .6s ease 1s forwards}
.t-sub{font-family:'Share Tech Mono',monospace;font-size:.55rem;letter-spacing:.3em;color:rgba(180,160,120,.4);text-transform:uppercase;opacity:0;animation:fadeR .6s ease 1.2s forwards}

/* HUD */
.hud{position:absolute;z-index:50;pointer-events:none;opacity:0;animation:fadeIn 1s ease 1.5s forwards}
.hud-tl{top:3vh;left:3vw}
.hud-br{bottom:3vh;right:3vw}
.hud-tr{top:3vh;right:3vw}
.hud-label{font-family:'Share Tech Mono',monospace;font-size:.5rem;letter-spacing:.25em;color:rgba(200,170,90,.35);text-transform:uppercase}
.hud-val{font-family:'Share Tech Mono',monospace;font-size:.9rem;color:rgba(200,170,90,.5);margin-top:2px}
.hud-val .num{color:rgba(200,170,90,.7)}

/* NV HINT */
.nv-hint{position:absolute;bottom:3vh;left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:8px;opacity:0;animation:fadeIn .8s ease 2.5s forwards;pointer-events:none}
.nv-hint .key{font-family:'Share Tech Mono',monospace;font-size:.6rem;letter-spacing:.15em;color:rgba(200,170,90,.5);border:1px solid rgba(200,170,90,.2);padding:3px 8px;border-radius:3px}
.nv-hint .desc{font-family:'Share Tech Mono',monospace;font-size:.5rem;letter-spacing:.2em;color:rgba(200,170,90,.3);text-transform:uppercase}

/* INFO PANEL */
.info-panel{position:fixed;z-index:9990;background:rgba(8,12,6,.94);border:1px solid rgba(200,170,90,.15);padding:1.2rem 1.6rem;max-width:300px;opacity:0;transform:translateY(10px);transition:opacity .4s,transform .4s;pointer-events:none;backdrop-filter:blur(8px)}
.info-panel.show{opacity:1;transform:translateY(0);pointer-events:auto}
.ip-title{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:.12em;color:#c8aa5a;margin-bottom:.4rem}
.ip-text{font-family:'Share Tech Mono',monospace;font-size:.62rem;line-height:1.9;color:rgba(200,180,140,.6)}
.ip-close{position:absolute;top:.4rem;right:.6rem;font-family:'Share Tech Mono',monospace;font-size:.6rem;color:rgba(200,170,90,.3);cursor:pointer;pointer-events:auto}
.ip-close:hover{color:#c8aa5a}

/* RIPPLE */
.ripple{position:fixed;width:40px;height:40px;border:1px solid rgba(200,170,90,.4);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%) scale(0);animation:rippleOut .6s ease forwards}
@keyframes rippleOut{to{transform:translate(-50%,-50%) scale(3);opacity:0}}

/* FIREFLY */
.firefly{position:absolute;width:3px;height:3px;background:rgba(200,170,90,.6);border-radius:50%;pointer-events:none;z-index:44;box-shadow:0 0 6px rgba(200,170,90,.3);transition:transform .3s ease-out}

/* AMBIENT CANVAS */
#ambientCanvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:42;pointer-events:none}

/* CLICK ZONES */
.click-zone{position:absolute;z-index:55;cursor:pointer;pointer-events:auto;transition:transform .2s}
.click-zone:hover{transform:scale(1.15)}
.cz-ring{width:26px;height:26px;border:1px solid rgba(200,170,90,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;animation:czPulse 3s ease-in-out infinite}
.cz-ring svg{width:10px;height:10px;fill:none;stroke:rgba(200,170,90,.5);stroke-width:2}
@keyframes czPulse{0%,100%{box-shadow:0 0 0 0 rgba(200,170,90,.1)}50%{box-shadow:0 0 0 8px rgba(200,170,90,0)}}
.cz-label{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;font-family:'Share Tech Mono',monospace;font-size:.5rem;letter-spacing:.12em;color:rgba(200,170,90,.8);text-transform:uppercase;opacity:0;transition:opacity .3s;pointer-events:none;background:rgba(8,12,6,.85);padding:3px 8px;border:1px solid rgba(200,170,90,.2);border-radius:2px;z-index:56}
.click-zone:hover .cz-label{opacity:1}

/* OVERLAYS */
.vignette{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.55) 100%);z-index:45;pointer-events:none}
.grain{position:absolute;top:0;left:0;width:100%;height:100%;z-index:46;pointer-events:none;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:256px 256px}
.scanline{position:absolute;top:0;left:0;width:100%;height:100%;z-index:47;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.02) 2px,rgba(0,0,0,.02) 4px);opacity:0;animation:fadeIn 1s ease 2s forwards}
.fog{position:absolute;width:200%;height:100%;top:0;left:-50%;opacity:.1;animation:fogDrift 40s linear infinite;pointer-events:none;z-index:40}
@keyframes fogDrift{0%{transform:translateX(0)}100%{transform:translateX(20%)}}
.nv-overlay{position:absolute;top:0;left:0;width:100%;height:100%;z-index:48;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,40,0,.08),rgba(0,20,0,.15));mix-blend-mode:screen;opacity:0;transition:opacity .5s}
.nv-overlay.active{opacity:1}

@keyframes fadeR{from{opacity:0;transform:translateX(-15px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(1px)}}
@keyframes lookAround{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(1.2deg)}88%{transform:rotate(-0.8deg)}}
@keyframes ledBlink{0%,100%{opacity:.15}50%{opacity:.9}}
#torsoGroup{animation:breathe 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
#headGroup{animation:lookAround 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
#radioLed{animation:ledBlink 2s ease-in-out infinite}
</style>
</head>
<body>

<svg style="position:absolute;width:0;height:0">
<defs>
  <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0b1a0b"/><stop offset="35%" stop-color="#1a2e1a"/><stop offset="65%" stop-color="#2a3a20"/><stop offset="100%" stop-color="#1a2810"/></linearGradient>
  <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a2a15"/><stop offset="100%" stop-color="#0d1508"/></linearGradient>
  <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#152510"/><stop offset="100%" stop-color="#0a1206"/></linearGradient>
  <linearGradient id="m3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#102008"/><stop offset="100%" stop-color="#070e04"/></linearGradient>
  <linearGradient id="gnd" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a1206"/><stop offset="100%" stop-color="#050a03"/></linearGradient>

  <radialGradient id="spotGlow" cx=".5" cy=".3" r=".6"><stop offset="0%" stop-color="rgba(200,180,120,.08)"/><stop offset="100%" stop-color="rgba(0,0,0,0)"/></radialGradient>
  <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".5"/></filter>
  <filter id="gl"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="fogB"><feGaussianBlur stdDeviation="40"/></filter>
</defs>
</svg>

<div class="scene" id="scene">

<!-- L0: Sky -->
<div class="layer" data-depth=".015">
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<rect width="1920" height="1080" fill="url(#skyG)"/>
<g class="stars" opacity=".5">
  <circle cx="100" cy="60" r="1" fill="#ddd"/><circle cx="250" cy="130" r=".7" fill="#ccc"/><circle cx="430" cy="50" r="1.1" fill="#ddd"/><circle cx="600" cy="160" r=".6" fill="#bbb"/><circle cx="780" cy="80" r="1" fill="#ddd"/><circle cx="920" cy="190" r=".5" fill="#ccc"/><circle cx="1080" cy="55" r="1.2" fill="#eee"/><circle cx="1230" cy="145" r=".8" fill="#ddd"/><circle cx="1380" cy="95" r=".7" fill="#ccc"/><circle cx="1530" cy="40" r=".9" fill="#ddd"/><circle cx="1680" cy="125" r=".6" fill="#bbb"/><circle cx="1830" cy="75" r="1.1" fill="#ddd"/><circle cx="180" cy="230" r=".4" fill="#aaa"/><circle cx="390" cy="200" r=".5" fill="#bbb"/><circle cx="700" cy="260" r=".35" fill="#999"/><circle cx="1000" cy="220" r=".6" fill="#bbb"/><circle cx="1300" cy="240" r=".45" fill="#aaa"/><circle cx="1600" cy="195" r=".5" fill="#bbb"/>
</g>

<circle cx="1520" cy="160" r="19" fill="rgba(230,220,180,.15)"/>
<!-- Spot light on soldier area -->
<ellipse cx="960" cy="500" rx="500" ry="400" fill="url(#spotGlow)"/>
</svg>
</div>

<!-- L1: Far mountains -->
<div class="layer" data-depth=".04">
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">

<!-- L2: Mid mountains -->

<!-- L3: Near hills -->
<div class="layer" data-depth=".14">
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<path d="M-100,860 L60,720 L220,770 L380,680 L540,750 L700,660 L860,730 L1020,670 L1180,740 L1340,680 L1500,730 L1660,690 L1820,740 L1920,700 L1920,1080 L0,1080Z" fill="url(#m3)" opacity=".78"/>

</g>
<rect x="0" y="955" width="1920" height="125" fill="url(#gnd)"/>
</svg>
</div>

<!-- L5: SOLDIER -->
<div class="layer" data-depth=".35" id="soldierLayer">
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<g id="soldierGroup" transform="translate(960,280) scale(1.5)" filter="url(#sh)">

  <!-- Shadow -->
  <ellipse cx="0" cy="480" rx="100" ry="16" fill="rgba(0,0,0,.3)"/>

  <!-- ====== BOOTS ====== -->

  <!-- ====== ARMS ====== -->

  <path d="M-64,218 L-69,265 L-60,268 L-56,224Z" fill="#3a4a2a"/>
  <ellipse cx="-66" cy="268" rx="10" ry="7" fill="#1a1a10"/>
  <!-- Glove detail -->

<script>
// PARALLAX
const layers=document.querySelectorAll('.layer');
let mx=0,my=0,tx=0,ty=0,cx=0,cy=0;
document.addEventListener('mousemove',e=>{mx=(e.clientX/innerWidth-.5)*2;my=(e.clientY/innerHeight-.5)*2});
function loop(){tx=mx;ty=my;cx+=(tx-cx)*.06;cy+=(ty-cy)*.06;layers.forEach(l=>{const d=+l.dataset.depth;l.style.transform=`translate3d(${cx*d*90}px,${cy*d*45}px,0)`});requestAnimationFrame(loop)}loop();
document.addEventListener('touchmove',e=>{const t=e.touches[0];mx=(t.clientX/innerWidth-.5)*2;my=(t.clientY/innerHeight-.5)*2});
if(window.DeviceOrientationEvent)window.addEventListener('deviceorientation',e=>{if(e.gamma!=null){mx=e.gamma/45;my=(e.beta-45)/45}});

// CROSSHAIR
const ch=document.getElementById('crosshair');let chX=innerWidth/2,chY=innerHeight/2,chTX=chX,chTY=chY;
document.addEventListener('mousemove',e=>{chTX=e.clientX;chTY=e.clientY});
(function a(){chX+=(chTX-chX)*.15;chY+=(chTY-chY)*.15;ch.style.left=chX+'px';ch.style.top=chY+'px';requestAnimationFrame(a)})();
document.addEventListener('mousedown',()=>ch.classList.add('active'));
document.addEventListener('mouseup',()=>ch.classList.remove('active'));

// RIPPLE
document.addEventListener('click',e=>{const r=document.createElement('div');r.className='ripple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);r.addEventListener('animationend',()=>r.remove())});

// FIREFLIES
const scene=document.getElementById('scene');const ff=[];
for(let i=0;i<14;i++){const f=document.createElement('div');f.className='firefly';f._x=Math.random()*innerWidth;f._y=Math.random()*innerHeight;f._a=Math.random()*Math.PI*2;f._r=Math.random()*80+40;f._ox=f._x;f._oy=f._y;f.style.left=f._x+'px';f.style.top=f._y+'px';scene.appendChild(f);ff.push(f)}
let fmx=innerWidth/2,fmy=innerHeight/2;document.addEventListener('mousemove',e=>{fmx=e.clientX;fmy=e.clientY});
function aFF(){ff.forEach(f=>{f._a+=.008+Math.random()*.002;f._x=f._ox+Math.cos(f._a)*f._r+(fmx-innerWidth/2)*.02;f._y=f._oy+Math.sin(f._a*.7)*f._r*.6+(fmy-innerHeight/2)*.02;if(f._x<-20)f._x=innerWidth+20;if(f._x>innerWidth+20)f._x=-20;if(f._y<-20)f._y=innerHeight+20;if(f._y>innerHeight+20)f._y=-20;f.style.transform=`translate(${f._x-f._ox}px,${f._y-f._oy}px)`;const d=Math.hypot(f._x-fmx,f._y-fmy);f.style.opacity=d<150?Math.max(.1,.6-d/300):.15;f.style.background=d<100?'rgba(255,200,80,0.8)':'rgba(200,170,90,0.5)'});requestAnimationFrame(aFF)}aFF();

// AMBIENT CANVAS
const canvas=document.getElementById('ambientCanvas'),ctx=canvas.getContext('2d');
function rc(){canvas.width=innerWidth;canvas.height=innerHeight}rc();window.addEventListener('resize',rc);
const dust=[];for(let i=0;i<50;i++)dust.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.5+.3,vx:(Math.random()-.5)*.15,vy:-Math.random()*.25-.05,a:Math.random()*.35+.1});
function aD(){ctx.clearRect(0,0,canvas.width,canvas.height);dust.forEach(p=>{p.x+=p.vx+(cx||0)*.3;p.y+=p.vy;if(p.y<-10){p.y=canvas.height+10;p.x=Math.random()*canvas.width}if(p.x<-10)p.x=canvas.width+10;if(p.x>canvas.width+10)p.x=-10;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(200,170,90,${p.a})`;ctx.fill()});requestAnimationFrame(aD)}aD();

// HUD
function uc(){const n=new Date();document.getElementById('hudTime').textContent=n.toTimeString().slice(0,8);document.getElementById('hudX').textContent=(mx/2+.5).toFixed(2);document.getElementById('hudY').textContent=(my/2+.5).toFixed(2);document.getElementById('hudDepth').textContent=(.35+(cx||0)*.1).toFixed(2)}setInterval(uc,1000);uc();

// CLICK ZONES
const infoData={
  head:{title:'CASCO BALISTICO CON NVG',text:'Casco balistico Ops-Core FAST con montaje Wilcox para gafas de vision nocturna AN/PVS-14. Sistema de comunicacion Peltor ComTac con microfono boom. Camuflaje tipo selva tropical mexicana. Correa de retention en barbilla.'},
  vest:{title:'CHALECO TACTICO CFE',text:'Chaleco tipo Plate Carrier del CFE con sistema MOLLE. 3 cargadores STANAG 5.56mm, radio AN/PRC-152A, IFAK de primeros auxilios, parche de la Bandera Nacional de Mexico e insignia del Cuerpo de Fuerzas Especiales. Sistema de hidratacion CamelBak integrado.'},
  weapon:{title:'FX-05 XIUHCOATL',text:'Fusil de asalto calibre 5.56x45mm NATO, modelo FX-05 Xiuhcoatl, fabricado por Sedena. Equipado con mira Aimpoint CompM4, laser AN/PEQ-15 IR, grip vertical Magpul y cargador de 30 tiros. Armamento standard del CFE.'}
};
const ip=document.getElementById('infoPanel'),ipT=document.getElementById('ipTitle'),ipX=document.getElementById('ipText');let az=null;
document.querySelectorAll('.click-zone').forEach(z=>{z.addEventListener('click',e=>{e.stopPropagation();const k=z.dataset.info;if(az===k){cIP();return}const d=infoData[k];ipT.textContent=d.title;ipX.textContent=d.text;ip.classList.add('show');const r=z.getBoundingClientRect();ip.style.left=(r.right+15)+'px';ip.style.top=(r.top-20)+'px';if(r.right+320>innerWidth)ip.style.left=(r.left-320)+'px';if(r.top+200>innerHeight)ip.style.top=(innerHeight-220)+'px';az=k})});
document.getElementById('ipClose').addEventListener('click',e=>{e.stopPropagation();cIP()});
document.addEventListener('click',e=>{if(!e.target.closest('.click-zone')&&!e.target.closest('.info-panel'))cIP()});
function cIP(){ip.classList.remove('show');az=null}

// NV TOGGLE
let nv=false;document.addEventListener('keydown',e=>{if(e.key==='n'||e.key==='N'){nv=!nv;document.getElementById('nvOverlay').classList.toggle('active',nv);document.querySelector('.scene').style.filter=nv?'hue-rotate(60deg) saturate(1.5) brightness(1.1)':'none'}});

// WEAPON SWAY
const wg=document.getElementById('weaponGroup');(function sw(){const t=performance.now()*.001;if(wg){const s=Math.sin(t*1.2)*1.2,sy=Math.sin(t*.8)*.6;wg.setAttribute('transform',`translate(-66,218) rotate(${s},0,25) translate(0,${sy})`)}requestAnimationFrame(sw)})();

// EYE BLINK
const eyeLO=document.getElementById('eyeLO'),eyeRO=document.getElementById('eyeRO'),eyeLI=document.getElementById('eyeLI'),eyeRI=document.getElementById('eyeRI');
function setEyes(ryO,ryI){if(!eyeLO)return;eyeLO.setAttribute('ry',ryO);eyeRO.setAttribute('ry',ryO);eyeLI.setAttribute('ry',ryI);eyeRI.setAttribute('ry',ryI)}
function blink(){
  if(!eyeLO)return;
  let step=0;const steps=8,dur=100,stepT=dur/steps;
  const close=()=>{step++;const p=step/steps;setEyes(5*(1-p),3.5*(1-p));if(step<steps)setTimeout(close,stepT);else setTimeout(open,30)};
  const open=()=>{let s=0;const doStep=()=>{s++;const p=s/steps;setEyes(5*p,3.5*p);if(s<steps)setTimeout(doStep,stepT);else setTimeout(blink,3500+Math.random()*4000)};doStep()};
  setTimeout(close,Math.random()*500);
}
setTimeout(blink,2000+Math.random()*2000);

// STARS TWINKLE
document.querySelectorAll('.stars circle').forEach(s=>{s.style.animation=`twinkle ${2+Math.random()*4}s ease-in-out ${Math.random()*3}s infinite alternate`});
const ts=document.createElement('style');ts.textContent='@keyframes twinkle{0%{opacity:.25}100%{opacity:.75}}';document.head.appendChild(ts);
</script>
</body>
